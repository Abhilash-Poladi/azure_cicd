name: Deploy Azure Data Factory

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: Environment to deploy to
        required: true
        type: choice
        options:
          - dev
          - uat
          - prod
      publish_commit:
        description: Full 40-character commit SHA from adf_publish
        required: true
        type: string
      confirm_dev_validation:
        description: For UAT/PROD, confirm this commit was validated in DEV
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  deployments: write
  id-token: write

concurrency:
  group: adf-deploy-${{ inputs.target_environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    steps:
      - name: Check out workflow source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate published commit
        shell: bash
        env:
          PUBLISH_COMMIT: ${{ inputs.publish_commit }}
        run: |
          if [[ ! "$PUBLISH_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "publish_commit must be a full 40-character commit SHA." >&2
            exit 1
          fi

          git fetch --no-tags origin adf_publish
          if ! git merge-base --is-ancestor "$PUBLISH_COMMIT" FETCH_HEAD; then
            echo "The supplied commit is not in the current adf_publish history." >&2
            exit 1
          fi

      - name: Check out the pinned ADF template
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.publish_commit }}
          path: published
          sparse-checkout: appogit/ARMTemplateForFactory.json
          sparse-checkout-cone-mode: false

      - name: Validate deployment parameters
        shell: bash
        env:
          PARAMETER_FILE: deploy/parameters/${{ inputs.target_environment }}.json
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from urllib.parse import urlsplit

          parameter_file = os.environ["PARAMETER_FILE"]
          with open(parameter_file, encoding="utf-8") as file:
              parameters = json.load(file)["parameters"]

          required = ("factoryName", "ls_dev_properties_typeProperties_url")
          for name in required:
              value = parameters.get(name, {}).get("value")
              if not isinstance(value, str) or not value.strip() or value.startswith("REPLACE_WITH_"):
                  print(f"{parameter_file}: set a real value for {name} before deploying.", file=sys.stderr)
                  sys.exit(1)

          storage_url = parameters["ls_dev_properties_typeProperties_url"]["value"]
          parsed_url = urlsplit(storage_url)
          if parsed_url.scheme != "https" or not parsed_url.netloc:
              print(f"{parameter_file}: the ADLS URL must be an absolute HTTPS URL.", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Require DEV validation confirmation for promotions
        if: inputs.target_environment != 'dev'
        env:
          CONFIRM_DEV_VALIDATION: ${{ inputs.confirm_dev_validation }}
        shell: bash
        run: |
          if [[ "$CONFIRM_DEV_VALIDATION" != "true" ]]; then
            echo "Confirm DEV validation of this exact published commit before promoting." >&2
            exit 1
          fi

      - name: Require a successful DEV deployment for promotions
        if: inputs.target_environment != 'dev'
        uses: actions/github-script@v7
        env:
          PUBLISH_COMMIT: ${{ inputs.publish_commit }}
        with:
          script: |
            const deployments = await github.paginate(github.rest.repos.listDeployments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              environment: "dev",
              sha: process.env.PUBLISH_COMMIT.toLowerCase(),
              per_page: 100
            });

            if (deployments.length === 0) {
              core.setFailed(`No DEV deployment was recorded for ${process.env.PUBLISH_COMMIT}. Deploy and validate this exact adf_publish commit in DEV first.`);
              return;
            }

            const statuses = await github.paginate(github.rest.repos.listDeploymentStatuses, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployments[0].id,
              per_page: 100
            });
            if (statuses[0]?.state !== "success") {
              core.setFailed(`The latest DEV deployment for ${process.env.PUBLISH_COMMIT} did not succeed. Deploy and validate this exact adf_publish commit in DEV first.`);
              return;
            }
            core.info(`Latest DEV deployment ${deployments[0].id} succeeded for ${process.env.PUBLISH_COMMIT}.`);

      - name: Record deployment start
        id: deployment
        uses: actions/github-script@v7
        env:
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          PUBLISH_COMMIT: ${{ inputs.publish_commit }}
        with:
          script: |
            const environment = process.env.TARGET_ENVIRONMENT;
            const { data: deployment } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: process.env.PUBLISH_COMMIT.toLowerCase(),
              environment,
              description: `ADF deployment from workflow run ${context.runId}`,
              auto_merge: false,
              required_contexts: [],
              transient_environment: false,
              production_environment: environment === "prod",
              payload: JSON.stringify({ workflow_run_id: context.runId })
            });
            core.setOutput("id", deployment.id);
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.id,
              state: "in_progress",
              description: `Deploying pinned adf_publish commit to ${environment}`
            });

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy pinned ARM template
        id: arm_deploy
        shell: bash
        env:
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          PARAMETER_FILE: deploy/parameters/${{ inputs.target_environment }}.json
          RESOURCE_GROUP: ${{ vars.ADF_RESOURCE_GROUP }}
          STORAGE_ACCOUNT_KEY: ${{ secrets.ADF_STORAGE_ACCOUNT_KEY }}
        run: |
          if [[ -z "$RESOURCE_GROUP" || -z "$STORAGE_ACCOUNT_KEY" ]]; then
            echo "Configure ADF_RESOURCE_GROUP and ADF_STORAGE_ACCOUNT_KEY in the selected GitHub Environment." >&2
            exit 1
          fi

          PARAMETER_FILE_WITH_KEY="$RUNNER_TEMP/adf-parameters-${GITHUB_RUN_ID}.json"
          trap 'rm -f "$PARAMETER_FILE_WITH_KEY"' EXIT
          python - "$PARAMETER_FILE" "$PARAMETER_FILE_WITH_KEY" <<'PY'
          import json
          import os
          import sys

          with open(sys.argv[1], encoding="utf-8") as file:
              parameters = json.load(file)
          parameters.setdefault("parameters", {})["ls_dev_accountKey"] = {
              "value": os.environ["STORAGE_ACCOUNT_KEY"]
          }
          with open(sys.argv[2], "w", encoding="utf-8") as file:
              json.dump(parameters, file)
          os.chmod(sys.argv[2], 0o600)
          PY

          az deployment group create \
            --name "adf-${TARGET_ENVIRONMENT}-${GITHUB_RUN_ID}" \
            --resource-group "$RESOURCE_GROUP" \
            --template-file published/appogit/ARMTemplateForFactory.json \
            --parameters "@${PARAMETER_FILE_WITH_KEY}" \
            --output none

      - name: Record deployment result
        if: always() && steps.deployment.outputs.id != ''
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
          DEPLOYMENT_STATE: ${{ steps.arm_deploy.outcome }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
        with:
          script: |
            const state = process.env.DEPLOYMENT_STATE === "success" ? "success" : "failure";
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: Number(process.env.DEPLOYMENT_ID),
              state,
              description: `${state === "success" ? "Deployed to" : "Deployment failed for"} ${process.env.TARGET_ENVIRONMENT}`
            });
