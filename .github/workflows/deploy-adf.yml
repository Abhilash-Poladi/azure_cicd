name: Deploy Azure Data Factory

on:
  push:
    branches:
      - adf_publish
      - uat
      - prod

permissions:
  contents: read
  deployments: write
  id-token: write

concurrency:
  group: adf-deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'adf_publish' && 'dev' || github.ref_name }}
    steps:
      - name: Check out deployment configuration
        uses: actions/checkout@v4
        with:
          path: config
          fetch-depth: 0

      - name: Resolve the published template commit
        id: artifact
        shell: bash
        env:
          SOURCE_BRANCH: ${{ github.ref_name }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          if [[ "$SOURCE_BRANCH" == "adf_publish" ]]; then
            ARTIFACT_SHA="$EVENT_SHA"
          else
            git -C config fetch --no-tags origin \
              "+refs/heads/adf_publish:refs/remotes/origin/adf_publish" \
              "+refs/heads/${SOURCE_BRANCH}:refs/remotes/origin/${SOURCE_BRANCH}"
            ARTIFACT_SHA="$(git -C config merge-base "$EVENT_SHA" origin/adf_publish)"
            if [[ -z "$ARTIFACT_SHA" ]]; then
              echo "The pushed $SOURCE_BRANCH commit does not include an adf_publish artifact commit." >&2
              exit 1
            fi
          fi

          if ! git -C config cat-file -e "${ARTIFACT_SHA}:appogit/ARMTemplateForFactory.json"; then
            echo "The selected commit does not contain the generated ADF ARM template." >&2
            exit 1
          fi

          echo "sha=$ARTIFACT_SHA" >> "$GITHUB_OUTPUT"
          echo "Pinned published ADF artifact: $ARTIFACT_SHA"

      - name: Validate published commit
        shell: bash
        env:
          PUBLISH_COMMIT: ${{ steps.artifact.outputs.sha }}
        run: |
          if [[ ! "$PUBLISH_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Selected published artifact is not a full 40-character commit SHA." >&2
            exit 1
          fi

          git -C config fetch --no-tags origin \
            "+refs/heads/adf_publish:refs/remotes/origin/adf_publish"
          git -C config cat-file -e "${PUBLISH_COMMIT}^{commit}"
          if ! git -C config merge-base --is-ancestor "$PUBLISH_COMMIT" origin/adf_publish; then
            echo "The selected commit is not in the current adf_publish history." >&2
            exit 1
          fi

      - name: Require the artifact to have succeeded in the previous environment
        if: github.ref_name != 'adf_publish'
        uses: actions/github-script@v7
        env:
          SOURCE_ENVIRONMENT: ${{ github.ref_name == 'uat' && 'dev' || 'uat' }}
          PUBLISH_COMMIT: ${{ steps.artifact.outputs.sha }}
        with:
          script: |
            const deployments = await github.paginate(github.rest.repos.listDeployments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              environment: process.env.SOURCE_ENVIRONMENT,
              sha: process.env.PUBLISH_COMMIT.toLowerCase(),
              per_page: 100
            });

            if (deployments.length === 0) {
              core.setFailed(`Artifact ${process.env.PUBLISH_COMMIT} has no recorded ${process.env.SOURCE_ENVIRONMENT.toUpperCase()} deployment.`);
              return;
            }

            const statuses = await github.paginate(github.rest.repos.listDeploymentStatuses, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployments[0].id,
              per_page: 100
            });
            if (statuses.length === 0 || statuses[0].state !== "success") {
              core.setFailed(`Artifact ${process.env.PUBLISH_COMMIT} was not successfully deployed to ${process.env.SOURCE_ENVIRONMENT.toUpperCase()}.`);
              return;
            }
            core.info(`Artifact ${process.env.PUBLISH_COMMIT} was successfully deployed to ${process.env.SOURCE_ENVIRONMENT.toUpperCase()}.`);

      - name: Check out the pinned ADF template
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.artifact.outputs.sha }}
          path: published
          sparse-checkout: appogit/ARMTemplateForFactory.json
          sparse-checkout-cone-mode: false

      - name: Validate deployment parameters
        shell: bash
        env:
          PARAMETER_FILE: config/deploy/parameters/${{ github.ref_name == 'adf_publish' && 'dev' || github.ref_name }}.json
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from urllib.parse import urlsplit

          parameter_file = os.environ["PARAMETER_FILE"]
          with open(parameter_file, encoding="utf-8") as file:
              parameters = json.load(file)["parameters"]

          required = ("factoryName", "ls_dev_properties_typeProperties_url")
          for name in required:
              value = parameters.get(name, {}).get("value")
              if not isinstance(value, str) or not value.strip() or value.startswith("REPLACE_WITH_"):
                  print(f"{parameter_file}: set a real value for {name} before deploying.", file=sys.stderr)
                  sys.exit(1)

          storage_url = parameters["ls_dev_properties_typeProperties_url"]["value"]
          parsed_url = urlsplit(storage_url)
          if parsed_url.scheme != "https" or not parsed_url.netloc:
              print(f"{parameter_file}: the ADLS URL must be an absolute HTTPS URL.", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Record deployment start
        id: deployment
        uses: actions/github-script@v7
        env:
          TARGET_ENVIRONMENT: ${{ github.ref_name == 'adf_publish' && 'dev' || github.ref_name }}
          PUBLISH_COMMIT: ${{ steps.artifact.outputs.sha }}
        with:
          script: |
            const environment = process.env.TARGET_ENVIRONMENT;
            const { data: deployment } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: process.env.PUBLISH_COMMIT.toLowerCase(),
              environment,
              description: `ADF deployment from workflow run ${context.runId}`,
              auto_merge: false,
              required_contexts: [],
              transient_environment: false,
              production_environment: environment === "prod",
              payload: JSON.stringify({ workflow_run_id: context.runId })
            });
            core.setOutput("id", deployment.id);
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.id,
              state: "in_progress",
              description: `Deploying pinned adf_publish commit to ${environment}`
            });

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy pinned ARM template
        id: arm_deploy
        shell: bash
        env:
          TARGET_ENVIRONMENT: ${{ github.ref_name == 'adf_publish' && 'dev' || github.ref_name }}
          PARAMETER_FILE: config/deploy/parameters/${{ github.ref_name == 'adf_publish' && 'dev' || github.ref_name }}.json
          RESOURCE_GROUP: ${{ vars.ADF_RESOURCE_GROUP }}
          STORAGE_ACCOUNT_KEY: ${{ secrets.ADF_STORAGE_ACCOUNT_KEY }}
        run: |
          if [[ -z "$RESOURCE_GROUP" || -z "$STORAGE_ACCOUNT_KEY" ]]; then
            echo "Configure ADF_RESOURCE_GROUP and ADF_STORAGE_ACCOUNT_KEY in the selected GitHub Environment." >&2
            exit 1
          fi

          PARAMETER_FILE_WITH_KEY="$RUNNER_TEMP/adf-parameters-${GITHUB_RUN_ID}.json"
          trap 'rm -f "$PARAMETER_FILE_WITH_KEY"' EXIT
          python - "$PARAMETER_FILE" "$PARAMETER_FILE_WITH_KEY" <<'PY'
          import json
          import os
          import sys

          with open(sys.argv[1], encoding="utf-8") as file:
              parameters = json.load(file)
          parameters.setdefault("parameters", {})["ls_dev_accountKey"] = {
              "value": os.environ["STORAGE_ACCOUNT_KEY"]
          }
          with open(sys.argv[2], "w", encoding="utf-8") as file:
              json.dump(parameters, file)
          os.chmod(sys.argv[2], 0o600)
          PY

          az deployment group create \
            --name "adf-${TARGET_ENVIRONMENT}-${GITHUB_RUN_ID}" \
            --resource-group "$RESOURCE_GROUP" \
            --template-file published/appogit/ARMTemplateForFactory.json \
            --parameters "@${PARAMETER_FILE_WITH_KEY}" \
            --output none

      - name: Record deployment result
        if: always() && steps.deployment.outputs.id != ''
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
          DEPLOYMENT_STATE: ${{ steps.arm_deploy.outcome }}
          TARGET_ENVIRONMENT: ${{ github.ref_name == 'adf_publish' && 'dev' || github.ref_name }}
        with:
          script: |
            const state = process.env.DEPLOYMENT_STATE === "success" ? "success" : "failure";
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: Number(process.env.DEPLOYMENT_ID),
              state,
              description: `${state === "success" ? "Deployed to" : "Deployment failed for"} ${process.env.TARGET_ENVIRONMENT}`
            });
